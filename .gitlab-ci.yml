stages:
  - test
  - release-check
  - build
  - release
  - trigger

.use-image:
  tags:
    - m2
  image:
    # bun 1.3.14 is expected to be the last version that runs on Zig
    name: oven/bun:1.3.14-alpine
    pull_policy: if-not-present

.prepare:
  extends:
    - .use-image
  before_script:
    - mkdir -p .bun/install/cache
    - bun install
  cache:
    key: "cache-bun"
    paths:
      - .bun/install/cache
  variables:
    BUN_INSTALL_CACHE: "$CI_PROJECT_DIR/.bun/install/cache"
    GIT_DEPTH: "0"
    GIT_CLEAN_FLAGS: -fdx -e node_modules/ -e dist/

test:biome:
  extends:
    - .prepare
  stage: test
  only:
    - main
    - merge_requests
  script:
    - bun run lint

test:unit:
  extends:
    - .prepare
  stage: test
  only:
    - main
    - merge_requests
  script:
    - bun run test

test:typecheck:
  extends:
    - .prepare
  stage: test
  only:
    - main
    - merge_requests
  script:
    - bun run typecheck

test:tsgo:
  extends:
    - .prepare
  stage: test
  only:
    - main
    - merge_requests
  script:
    - bun run tsgo

release:check:
  extends:
    - .prepare
  stage: release-check
  only:
    - main
  script:
    - bun scripts/ci/ensure-release.ts
  artifacts:
    reports:
      dotenv: release.env

build:
  extends:
    - .prepare
  stage: build
  only:
    - main
  parallel:
    matrix:
      - PLATFORM: "darwin-arm64"
        BUILD_SCRIPT: "build:darwin-arm64"
      - PLATFORM: "darwin-x64"
        BUILD_SCRIPT: "build:darwin-x64"
      - PLATFORM: "linux-x64"
        BUILD_SCRIPT: "build:linux-x64"
      - PLATFORM: "linux-arm64"
        BUILD_SCRIPT: "build:linux-arm64"
      # - PLATFORM: "win-x64"
      #   BUILD_SCRIPT: "build:win-x64"
      # - PLATFORM: "win-arm64"
      #   BUILD_SCRIPT: "build:win-arm64"
  needs:
    - job: release:check
      artifacts: true
  script:
    - bun scripts/ci/build-and-publish.ts
  artifacts:
    paths:
      - dist/gitlab-copilot-ci-${RELEASE_VERSION}-${PLATFORM}*
    expire_in: 1 week

release:publish:
  extends:
    - .prepare
  stage: release
  only:
    - main
  needs:
    - job: release:check
      artifacts: true
    - job: build
      artifacts: true
  script:
    - bun scripts/ci/publish-release.ts

trigger:runner:
  extends:
    - .use-image
  stage: trigger
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RUNNER_TRIGGER_TOKEN'
      when: on_success
    - when: never
  needs:
    - job: release:check
      artifacts: true
    - job: release:publish
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -z "${RUNNER_TRIGGER_URL:-}" ]; then
        echo "Missing RUNNER_TRIGGER_URL"
        exit 1
      fi

      if [ -z "${RUNNER_TARGET_JOB:-}" ]; then
        echo "Missing RUNNER_TARGET_JOB"
        exit 1
      fi

      curl -X POST \
        --fail \
        -F "token=${RUNNER_TRIGGER_TOKEN}" \
        -F "ref=main" \
        -F "variables[TARGET_JOB]=${RUNNER_TARGET_JOB}" \
        -F "variables[GITLAB_COPILOT_CLI_VERSION]=${RELEASE_TAG}" \
        "${RUNNER_TRIGGER_URL}"
